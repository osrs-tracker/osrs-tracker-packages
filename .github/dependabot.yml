# Weekly update PRs for the action refs in .github/workflows/. Third-party actions are pinned by SHA, which Dependabot
# doesn't alert on, so these PRs are how their fixes arrive. npm updates are not set up here
# (osrs-tracker/osrs-tracker-packages#6).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Waits a week after a release before proposing it, so a compromised release is likely caught first. Security
    # updates skip the cooldown
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
