name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

  workflow_dispatch:

# Read-only unless a job asks for more: build and test run code from every installed package, so they get a token that
# can't push or approve pull requests, whatever the repository's default is
permissions:
  contents: read

jobs:
  # Every package on every push: four small packages don't need change detection. One job, so one npm ci for the whole
  # workspace
  packages:
    name: Prettier and packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          # Caches ~/.npm by the root package-lock.json
          cache: npm

      - name: Install
        run: npm ci
        env:
          # The postinstall fetches mongodb-memory-server's default MongoDB, which no spec runs: models' Vitest
          # globalSetup downloads the version they do
          MONGOMS_DISABLE_POSTINSTALL: '1'

      - name: Prettier
        run: npm run prettier:ci

      - name: Read the MongoDB version
        id: mongodb
        run: |
          version=$(grep -oP "MONGODB_VERSION = '\K[^']+" packages/models/src/mongodb.global-setup.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # models' *.int.spec.ts start an in-memory MongoDB; its binary is about 200 MB
      - name: Cache the MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ runner.arch }}-${{ steps.mongodb.outputs.version }}

      # Unused files, dependencies and internal exports (knip.jsonc); the packages' public exports count as used
      - name: knip
        run: npm run knip

      # Copy-pasted code in packages/ (.jscpd.json): fails when more than 1% of the lines are duplicated, the specs left
      # out
      - name: jscpd
        run: npm run jscpd

      # The root scripts run every package in workspace order: hiscores builds and type-checks against the local
      # models, whose exports point at dist/, so models is built first
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Vitest doesn't type-check, and the build's tsconfig covers only src/index.ts, hence tsconfig.spec.json
      - name: Type-check the specs
        run: npm run typecheck

      # Every package's specs, one Vitest project each (vitest.config.mts)
      - name: Test
        run: npm test

      # Loads each build with require and import, also from the packed tarball, as the consumers do
      - name: Load check
        run: |
          for dir in $(jq -r '.workspaces[]' package.json); do
            (cd "$dir" && ../../.github/scripts/check-package-loads.sh)
          done

  # Local links and #anchors in every Markdown file, on every push. --offline skips external URLs, --hidden includes
  # .claude/; .gitignored files (node_modules, dist) are skipped
  links:
    name: Link check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --hidden --no-progress './**/*.md'
          fail: true
          jobSummary: false

  # The required check (zizmor.yml's zizmor is the other): fails when any job failed or was cancelled
  ci:
    name: CI
    if: always()
    needs: [packages, links]
    runs-on: ubuntu-latest

    steps:
      - name: All checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
